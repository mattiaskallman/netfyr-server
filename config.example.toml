# NetFyr Server — exempelkonfiguration.
# Kopiera till /etc/netfyr/config.toml och anpassa.

# Adress att lyssna på.
#
# 127.0.0.1 bakom en TLS-terminerande proxy (rekommenderat, se README).
# 0.0.0.0 bara om du vet vad du gör — då går trafiken i klartext.
listen = "127.0.0.1:8080"

# Databas och hemligheter (secrets.enc + secrets.key) hamnar bredvid.
database = "/var/lib/netfyr/netfyr.db"

# Frontend-filer.
static_dir = "/usr/local/share/netfyr/web"

# Loggnivå: error, warn, info, debug, trace.
log_level = "info"

# Secure-flagga på sessionskakan. Sätt true när tjänsten nås över HTTPS
# — då vägrar webbläsaren att skicka kakan över okrypterade anslutningar.
# Lämna false bara vid ren utveckling över HTTP.
secure_cookies = true

# Administratörens absoluta sessionslivslängd i timmar. Värden över 12
# begränsas alltid till 12 av servern; idle-gränsen nedan gäller samtidigt.
session_hours = 12

# Administratörer loggas ut efter denna tid utan mänsklig aktivitet.
# Automatisk statuspollning håller inte sessionen vaken.
admin_idle_minutes = 15

# Operatörssessioner kan stå öppna kontinuerligt och förnyas vid mänsklig
# aktivitet. Helt övergivna sessioner löper ändå ut efter denna tid.
operator_session_days = 30
