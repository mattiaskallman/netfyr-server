name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-07
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Shell syntax
        run: bash -n deploy/*.sh scripts/*.sh community-scripts/ct/*.sh community-scripts/install/*.sh
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/i18n.js
          node --check web/refresh-coordinator.js
          node --check web/service-worker.js
      - name: PWA tests
        run: ./scripts/test-pwa.sh
      - name: Release security tests
        run: |
          ./scripts/test-release-download.sh
          ./scripts/test-update-transaction.sh
          ./scripts/test-community-installer-regressions.sh
          ./scripts/test-first-run-language.sh
          ./scripts/test-release-chain.sh
      - name: Verify release archive
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          ./scripts/build-release.sh
          ./scripts/verify-release.sh "dist/netfyr-server-v${version}-linux-amd64.tar.gz"
